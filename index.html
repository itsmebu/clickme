<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Me</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b1a2e;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .btn {
            border: none;
            font-size: 1.4rem;
            font-weight: 600;
            padding: 1rem 3rem;
            border-radius: 60px;
            cursor: pointer;
            background: #2a6f9c;
            color: white;
            box-shadow: 0 6px 0 #10344e, 0 10px 20px -5px black;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: #3586bb;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #10344e, 0 15px 25px -5px black;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #10344e, 0 10px 16px -5px black;
        }

        .btn.hidden {
            display: none;
        }

        /* Full screen audio wrapper */
        .audio-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1a2e;
            z-index: 1000;
        }

        .audio-wrapper.hidden {
            display: none;
        }

        audio {
            width: 90%;
            max-width: 600px;
            outline: none;
        }
    </style>
</head>
<body>

    <button class="btn" id="clickMeBtn">Click Me</button>

    <div class="audio-wrapper hidden" id="audioWrapper">
        <audio id="myAudio" controls playsinline>
            <source src="3.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        const clickMeBtn = document.getElementById('clickMeBtn');
        const audioWrapper = document.getElementById('audioWrapper');
        const audio = document.getElementById('myAudio');

        clickMeBtn.addEventListener('click', function () {
            // Hide the button
            clickMeBtn.classList.add('hidden');

            // Show the full screen audio wrapper
            audioWrapper.classList.remove('hidden');

            // Play the audio
            audio.play().catch(function (error) {
                console.warn('Autoplay blocked or failed:', error);
            });
        });

        // When the audio ends: hide the audio wrapper
        audio.addEventListener('ended', function () {
            audioWrapper.classList.add('hidden');
            // Optionally show the button again
            // clickMeBtn.classList.remove('hidden');
        });
    </script>

</body>
</html>
