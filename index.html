<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Me</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b1a2e;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 2rem;
        }

        .btn {
            border: none;
            font-size: 1.4rem;
            font-weight: 600;
            padding: 1rem 3rem;
            border-radius: 60px;
            cursor: pointer;
            background: #2a6f9c;
            color: white;
            box-shadow: 0 6px 0 #10344e, 0 10px 20px -5px black;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: #3586bb;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #10344e, 0 15px 25px -5px black;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #10344e, 0 10px 16px -5px black;
        }

        .btn.hidden {
            display: none;
        }

        .video-wrapper {
            max-width: 800px;
            width: 100%;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 12px 25px -8px black;
        }

        .video-wrapper.hidden {
            display: none;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
            border-radius: 1rem;
        }

        .sorry-message {
            font-size: 3rem;
            font-weight: 800;
            color: #ff5c5c;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 92, 92, 0.6), 0 4px 10px rgba(0,0,0,0.7);
            animation: fadeIn 0.8s ease forwards;
        }

        .sorry-message.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <button class="btn" id="clickMeBtn">Click Me</button>

    <div class="video-wrapper hidden" id="videoWrapper">
        <video id="myVideo" controls playsinline>
            <source src="vid.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="sorry-message hidden" id="sorryMessage">SORRY NA</div>

    <script>
        const clickMeBtn = document.getElementById('clickMeBtn');
        const videoWrapper = document.getElementById('videoWrapper');
        const video = document.getElementById('myVideo');
        const sorryMessage = document.getElementById('sorryMessage');

        clickMeBtn.addEventListener('click', function () {
            // Hide the button
            clickMeBtn.classList.add('hidden');

            // Show the video
            videoWrapper.classList.remove('hidden');

            // Play the video
            video.play().catch(function (error) {
                console.warn('Autoplay blocked or failed:', error);
            });
        });

        // When the video ends, show "SORRY NA"
        video.addEventListener('ended', function () {
            sorryMessage.classList.remove('hidden');
        });
    </script>

</body>
</html>
